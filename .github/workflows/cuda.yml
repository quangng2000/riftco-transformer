name: CUDA compile and no-device tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cuda-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cuda-toolkit:
    name: CUDA Toolkit 12 / Linux x86-64
    runs-on: ubuntu-24.04
    container: nvidia/cuda:12.4.1-devel-ubuntu22.04
    timeout-minutes: 30
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential git ninja-build python3 python3-pip
          python3 -m pip install cmake==3.31.6

      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Configure CUDA without requiring a GPU
        run: >-
          cmake -S . -B build/cuda-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CUDA_ARCHITECTURES=75
          -DBUILD_TESTING=ON
          -DRIFTCO_TRANSFORMER_ENABLE_CUDA=ON

      - name: Compile CUDA backend
        run: cmake --build build/cuda-ci --parallel 2

      - name: Run no-device contract tests
        run: ctest --test-dir build/cuda-ci --output-on-failure
