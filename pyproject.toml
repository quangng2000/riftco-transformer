[build-system]
requires = ["scikit-build-core==1.0.3"]
build-backend = "scikit_build_core.build"

[project]
name = "riftco-transformer"
version = "0.3.0"
description = "Dependency-free staged Python and C++ Transformer framework"
readme = "python/README.md"
requires-python = ">=3.10"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Quang T Nguyen" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: C++",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/quangng2000/riftco-transformer"
Issues = "https://github.com/quangng2000/riftco-transformer/issues"
Repository = "https://github.com/quangng2000/riftco-transformer"

[tool.scikit-build]
cmake.version = ">=3.24"
cmake.build-type = "Release"
install.components = ["PythonWheel"]
sdist.exclude = [
  "**/__pycache__/**",
  "**/*.pyc",
  "data/external/**",
  "data/pretraining/huggingface/**",
]
sdist.reproducible = true
wheel.exclude = ["**/__pycache__/**", "**/*.pyc"]
wheel.packages = ["python/riftco_transformer"]
wheel.py-api = "py3"
wheel.reproducible = true

[tool.scikit-build.cmake.define]
BUILD_TESTING = "OFF"
RIFTCO_TRANSFORMER_BUILD_CLI = "OFF"
RIFTCO_TRANSFORMER_BUILD_PYTHON_WHEEL = "ON"
RIFTCO_TRANSFORMER_BUILD_TESTS = "OFF"
RIFTCO_TRANSFORMER_ENABLE_CUDA = "OFF"
RIFTCO_TRANSFORMER_ENABLE_TPU = "OFF"
